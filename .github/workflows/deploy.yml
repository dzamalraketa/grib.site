name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -d _site || (echo "::error::_site/ not found" && exit 1)
          test -f _site/index.html || (echo "::error::_site/index.html missing" && exit 1)
          test -f _site/CNAME || (echo "::error::_site/CNAME missing" && exit 1)
          test -f _site/feed.xml || (echo "::error::_site/feed.xml missing" && exit 1)
          test -d _site/pagefind || (echo "::error::_site/pagefind/ missing" && exit 1)
          ISSLED_COUNT=$(find _site/issledovaniya -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          STATI_COUNT=$(find _site/stati -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Issledovaniya pages: $ISSLED_COUNT (min 35 required)"
          echo "Stati pages: $STATI_COUNT (min 19 required)"
          test "$ISSLED_COUNT" -ge 35 || (echo "::error::Too few issledovaniya pages: $ISSLED_COUNT" && exit 1)
          test "$STATI_COUNT" -ge 19 || (echo "::error::Too few stati pages: $STATI_COUNT" && exit 1)
          grep -q '?v=[0-9]' _site/index.html || (echo "::error::Cache-busting version missing in index.html" && exit 1)
          echo "Build verification: OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
