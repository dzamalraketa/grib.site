# _config.yml — заглушка для GitHub Pages auto-workflow (pages-build-deployment).
#
# GitHub Pages параллельно с кастомным workflow запускает свой
# auto-workflow, который тянет Docker-образ actions/jekyll-build-pages
# и собирает репозиторий как Jekyll-сайт из корня. В нашем проекте
# исходники Eleventy лежат в src/ и используют Nunjucks-теги
# ({{ ... | url }}, {% extends ... %}), которые Jekyll/Liquid
# не понимает — билд падает, приходит письмо "Run failed".
#
# Реальная сборка делается в .github/workflows/deploy.yml
# (Node → eleventy → pagefind → actions/deploy-pages).
#
# Здесь мы говорим Jekyll: "не обрабатывай ничего". На реальный
# деплой это не влияет — кастомный workflow перетирает вывод.
#
# Pages-source в GitHub: Settings → Pages → Source должен быть
# "GitHub Actions" с выбранным .github/workflows/deploy.yml.

include: []

exclude:
  - src
  - scripts
  - .github
  - node_modules
  - _site
  - MUSHROOMREFERENCES.md
  - README.md
  - eleventy.config.js
  - package.json
  - package-lock.json
  - vercel.json
  - .gitignore
  - .vercelignore
  - CNAME

theme: null
plugins: []
